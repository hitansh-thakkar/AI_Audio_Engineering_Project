# Dhvani — default pipeline configuration
# Every behavioral knob lives here. Code reads from config; never hardcode model IDs.

run:
  seed: 42
  device: cuda            # cuda | cpu
  output_dir: outputs/
  save_intermediate: true # dump per-stage artifacts for debugging/eval

preprocessing:
  target_sample_rate: 16000
  mono: true
  normalize: peak         # peak | lufs | none
  denoise: none           # none | demucs | dns  (demucs = music/vocal split, NOT speaker separation)
  chunk_seconds: 120      # split long files for the demo

diarization:
  source: real            # real | oracle   (oracle loads ground-truth RTTM — for the ablation)
  backend: community1     # community1 (free, local) | legacy31 (free, local) | precision2 (OPTIONAL PAID API)
  model: pyannote/speaker-diarization-community-1   # free: needs a free HF token + accepting the community-1 AND segmentation licenses
  min_speakers: null
  max_speakers: null
  rttm_dir: data/refs/rttm/   # used when source: oracle
  # precision2 is a paid pyannoteAI cloud API (per-use credits) — NOT part of the free local path.
  # It stays available only as an optional accuracy ceiling; leave backend on community1 for a zero-cost run.

separation:
  mode: overlap           # none | overlap | everywhere   (everywhere = ablation, expected to hurt)
  backend: sepformer      # sepformer | resepformer | convtasnet
  model: speechbrain/sepformer-wsj02mix
  model_sample_rate: 8000 # checkpoints are 8 kHz; resample in/out
  max_speakers_supported: 2   # documented hard limit

asr:
  backend: faster_whisper # faster_whisper (local, default) | indicconformer (optional, heavy NeMo)
  # `model` selects the CTranslate2 weights faster-whisper loads:
  #   large-v3            → Whisper baseline (int8 ≈ 2–4 GB VRAM, or CPU)
  #   distil-large-v3 / medium / small → fallbacks for weak hardware / tight disk
  #   <path-to-tara-ct2>  → Tara converted to CTranslate2 (recommended for Hindi/Hinglish — see docs/MODELS.md)
  model: large-v3
  device: cuda            # cuda | cpu   (4 GB VRAM fits large-v3 int8; use cpu if you hit OOM)
  compute_type: int8      # int8 (CPU / low-VRAM) | int8_float16 (GPU) | float16
  align: true             # WhisperX wav2vec2 forced alignment for word timestamps
  align_backend: whisperx
  # normalization for METRICS only — never Whisper default for Devanagari
  normalizer: indic_script_safe   # NFC + indic-nlp-library

postprocessing:
  # Fully LOCAL LLM via Ollama — no paid APIs, no per-token cost.
  backend: ollama         # ollama (local) | api (OPTIONAL PAID frontier/Sarvam API — see docs/MODELS.md)
  model: qwen3:4b         # Ollama tag — shipped default tuned for a 4 GB-VRAM laptop; scale up per docs/LOCAL_SETUP.md tier table
  host: http://localhost:11434   # local Ollama server
  structured_output: true # summary + tags + speaker-separated dialogue
  factual_consistency_check: true   # flag report claims not grounded in transcript
  forbid_new_facts: true

evaluation:
  metrics:
    separation: [si_snri, sdri]
    diarization: [der, jer, speaker_count_error]
    asr: [wer, cer]           # reported per register: hindi | english | codeswitch
    summary: [rouge_l, bertscore, factual_consistency]
  measure_latency: true
  measure_peak_memory: true
