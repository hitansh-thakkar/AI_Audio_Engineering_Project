# Dhvani — live / arbitrary-upload config (used by the Streamlit UI "Separate my audio").
# Real diarization (hand-applied Spectral clustering) + pyannote overlap detection so that
# overlapping speech in a user's own recording is detected and separated. Falls back
# gracefully to per-speaker tracks (no overlap split) if the pyannote licence isn't accepted.

run:
  seed: 42
  device: cpu
  output_dir: outputs/
  save_intermediate: true
  order: diar_first

preprocessing:
  target_sample_rate: 16000
  mono: true
  highpass_hz: 0 # OFF: a high-pass on the diarization path distorts ECAPA embeddings and over-counts speakers (measured clip_01 3->6, any filter order). denoise_output cleans the final tracks instead.
  denoise: none # keep OFF on the diarization path (distorts ECAPA embeddings -> speaker over-count)
  denoise_output: spectral # clean the final per-speaker tracks instead (market/village noise)
  normalize: lufs # consistent loudness across recordings
  target_lufs: -23.0
  trim_silence: true
  trim_top_db: 30
  chunk_seconds: 120

diarization:
  source: real
  backend: community1
  model: pyannote/speaker-diarization-community-1
  clustering: spectral # compulsory hand-applied clustering owns speaker attribution
  count_method: silhouette # robust speaker counting (best overlap-set accuracy); eigengap over-counts short overlap clips
  affinity: refined # pruned+symmetrised kNN affinity so the cut lands on the speaker boundary, not a time boundary
  overlap_detector: pyannote # REAL uploads need true simultaneous-speech detection (hand clustering yields non-overlapping turns); community-1, gated-but-free HF_TOKEN, degrades to inferred if unavailable
  emit_timeline_json: true
  embedding: ecapa # SpeechBrain ECAPA speaker embeddings (open) -> far better clustering
  vad_top_db: 30
  window_seconds: 1.5
  window_hop: 0.75
  num_speakers: null
  min_speakers: null
  max_speakers: null
  rttm_dir: null

separation:
  mode: overlap
  backend: sepformer
  model: speechbrain/sepformer-wsj02mix
  model_sample_rate: 8000
  max_speakers_supported: 2
  context_seconds: 3.0

asr:
  backend: indicwav2vec   # proposal's localized Indic ASR (IndicWav2Vec, native script); gated-but-free on HF (HF_TOKEN + accepted licence, like pyannote)
  model: ai4bharat/indicwav2vec-hindi   # per-language native-script CTC; swap for another-language IndicWav2Vec
  language: hi            # IndicWav2Vec is per-language; for English/mixed content use backend=faster_whisper, language=auto
  device: cpu
  compute_type: int8
  align: false            # wav2vec2 CTC = segment-level text (no word timestamps); faster_whisper gives word timestamps
  normalizer: indic_script_safe
  # Alternatives: backend=faster_whisper (multilingual, word timestamps, no gate) | indicconformer (multilingual Indic, NeMo, gated) | sarvam (PAID)

postprocessing:
  backend: gemini
  model: gemini-3.8-flash
  api_key_env: GEMINI_API_KEY
  host: http://localhost:11434
  structured_output: true
  factual_consistency_check: true
  forbid_new_facts: true

evaluation:
  metrics:
    separation: [si_snri, sdri]
    diarization: [der, jer, speaker_count_error]
    asr: [wer, cer]
    summary: [rouge_l, bertscore, factual_consistency]
  measure_latency: true
  measure_peak_memory: true
