# Dhvani — live / arbitrary-upload config (used by the Streamlit UI "Separate my audio").
# Real diarization (hand-applied Spectral clustering) + pyannote overlap detection so that
# overlapping speech in a user's own recording is detected and separated. Falls back
# gracefully to per-speaker tracks (no overlap split) if the pyannote licence isn't accepted.

run:
  seed: 42
  device: cpu
  output_dir: outputs/
  save_intermediate: true
  order: diar_first

preprocessing:
  target_sample_rate: 16000
  mono: true
  highpass_hz: 70 # mobile-mic rumble / mains hum (proposal's real-world audio)
  denoise: none # keep OFF on the diarization path (distorts ECAPA embeddings -> speaker over-count)
  denoise_output: spectral # clean the final per-speaker tracks instead (market/village noise)
  normalize: lufs # consistent loudness across recordings
  target_lufs: -23.0
  trim_silence: true
  trim_top_db: 30
  chunk_seconds: 120

diarization:
  source: real
  backend: community1
  model: pyannote/speaker-diarization-community-1
  clustering: spectral # compulsory hand-applied clustering owns speaker attribution
  overlap_detector: none # overlaps inferred from diarized turns (fast); pyannote = slower, gated, more accurate
  emit_timeline_json: true
  embedding: ecapa # SpeechBrain ECAPA speaker embeddings (open) -> far better clustering
  single_speaker_cos: 0.35 # k=2 centroids this similar => one speaker (measured: same voice 0.43-0.63, different 0.24-0.26)
  vad_top_db: 30
  window_seconds: 1.5
  window_hop: 0.75
  num_speakers: null
  min_speakers: null
  max_speakers: null
  rttm_dir: null

separation:
  mode: overlap
  backend: sepformer
  model: speechbrain/sepformer-wsj02mix
  model_sample_rate: 8000
  max_speakers_supported: 2
  context_seconds: 3.0

asr:
  backend: sarvam
  model: saaras:v4
  fallback_model: gemini-3.5-flash-lite # Gemini audio ASR used only if Sarvam fails on every turn
  device: cpu
  compute_type: int8
  align: true
  align_backend: whisperx
  normalizer: indic_script_safe

postprocessing:
  backend: gemini
  model: gemini-3.5-flash-lite # free tier; 3.8-flash allows only 20 requests/day
  fallback_models: [gemini-3.1-flash-lite, gemini-3.5-flash, gemini-flash-lite-latest] # separate free-tier quota each; tried in order on 429/404
  api_key_env: GEMINI_API_KEY
  host: http://localhost:11434
  structured_output: true
  factual_consistency_check: true
  forbid_new_facts: true

evaluation:
  metrics:
    separation: [si_snri, sdri]
    diarization: [der, jer, speaker_count_error]
    asr: [wer, cer]
    summary: [rouge_l, bertscore, factual_consistency]
  measure_latency: true
  measure_peak_memory: true
