# Dhvani — overlap-separation demo config.
# Runs the full pipeline on a pre-built overlap mixture (dhvani_eval/overlap_mixtures),
# using the ground-truth RTTM as oracle diarization so the overlap regions are known, and
# disabling silence-trim / normalize so the audio timeline still lines up with that RTTM.
# Output: outputs/<mix_id>/speakers/<speaker>.wav with overlaps separated per speaker.

run:
  seed: 42
  device: cpu
  output_dir: outputs/
  save_intermediate: true
  order: diar_first

preprocessing:
  target_sample_rate: 16000
  mono: true
  normalize: none         # keep amplitude so the mix matches the clean references
  denoise: none
  trim_silence: false     # keep the timeline aligned with the oracle RTTM
  trim_top_db: 30
  chunk_seconds: 120

diarization:
  source: oracle          # use the mixture's ground-truth turns (overlaps are known)
  backend: community1
  model: pyannote/speaker-diarization-community-1
  clustering: spectral
  emit_timeline_json: true
  embedding: auto
  num_speakers: null
  min_speakers: null
  max_speakers: null
  rttm_dir: dhvani_eval/overlap_mixtures/rttm

separation:
  mode: overlap
  backend: sepformer
  model: speechbrain/sepformer-wsj02mix
  model_sample_rate: 8000
  max_speakers_supported: 2
  context_seconds: 3.0

asr:
  backend: faster_whisper
  model: large-v3
  device: cpu
  compute_type: int8
  align: true
  align_backend: whisperx
  normalizer: indic_script_safe

postprocessing:
  backend: gemini
  model: gemini-3.8-flash
  fallback_models: [gemini-3.1-flash-lite, gemini-3.5-flash, gemini-flash-lite-latest] # separate free-tier quota each; tried in order on 429/404
  api_key_env: GEMINI_API_KEY
  host: http://localhost:11434
  structured_output: true
  factual_consistency_check: true
  forbid_new_facts: true

evaluation:
  metrics:
    separation: [si_snri, sdri]
    diarization: [der, jer, speaker_count_error]
    asr: [wer, cer]
    summary: [rouge_l, bertscore, factual_consistency]
  measure_latency: true
  measure_peak_memory: true
