# Dhvani — default pipeline configuration
# Every behavioral knob lives here. Code reads from config; never hardcode model IDs.

run:
  seed: 42
  device: cpu             # cuda | cpu
  output_dir: outputs/
  save_intermediate: true # dump per-stage artifacts for debugging/eval
  order: diar_first       # diar_first (default, our design) | sep_first (literal proposal baseline)

preprocessing:
  target_sample_rate: 16000
  mono: true
  highpass_hz: 0          # keep 0: a high-pass on the diarization path distorts ECAPA embeddings -> speaker over-count (measured). Rumble is handled by denoise_output on the final tracks.
  denoise: none           # none | spectral — on the DIARIZATION path (distorts embeddings; prefer denoise_output)
  denoise_output: none    # none | spectral — denoise only the final per-speaker tracks (safe; market-noise case)
  normalize: peak         # peak | lufs | none
  target_lufs: -23.0      # used when normalize: lufs (ITU-R BS.1770 integrated loudness)
  trim_silence: true
  trim_top_db: 30
  chunk_seconds: 120      # split long files for the demo

diarization:
  source: real            # real | oracle   (oracle loads ground-truth RTTM — for the ablation)
  backend: community1     # community1 (free, local) | legacy31 (free, local) | precision2 (OPTIONAL PAID API)
  model: pyannote/speaker-diarization-community-1
  clustering: spectral    # REQUIRED (proposal M2): spectral | gmm = hand-applied clustering of embeddings | builtin = pyannote end-to-end
  count_method: silhouette  # estimate #speakers when unknown: silhouette (robust; best balance — overlap-set count acc 0.75) | eigengap (edges sequential but over-counts short overlap clips)
  affinity: refined       # spectral affinity graph: refined (pruned+symmetrised kNN, best) | cosine (raw, legacy)
  overlap_detector: none  # none | pyannote (gated-but-free model → overlap regions for separation; needs HF_TOKEN + accepted licence)
  emit_timeline_json: true  # REQUIRED M2 deliverable: time->speaker timeline JSON alongside the RTTM
  embedding: ecapa        # ecapa = SpeechBrain ECAPA (best; measured DER median ~0.10 vs 0.34 for mfcc) | auto/mfcc = offline fallback
  vad_top_db: 30          # energy-VAD silence threshold (dB below peak)
  window_seconds: 1.5     # embedding window length over VAD regions
  window_hop: 0.75        # embedding window hop
  num_speakers: null
  min_speakers: null
  max_speakers: null
  rttm_dir: null          # used when source: oracle (dir of <clip_id>.rttm)

separation:
  mode: overlap           # none | overlap | everywhere   (everywhere = ablation, expected to hurt)
  backend: sepformer      # sepformer | resepformer | whamr | wham (SpeechBrain) | convtasnet (Asteroid, optional)
  model: speechbrain/sepformer-wsj02mix   # swap for sepformer-whamr (noise-robust) or a 16 kHz checkpoint
  model_sample_rate: 8000 # must match the checkpoint (set 16000 for a 16 kHz model); we resample in/out
  max_speakers_supported: 2   # documented hard limit (set to the model's #sources)
  context_seconds: 3.0    # widen each overlap region by this margin so the separator has
                          # solo context to anchor each voice (bare-overlap slices separate poorly)

asr:
  backend: faster_whisper # open/multilingual default so a cold run needs no gate | indicwav2vec = proposal's localized Indic ASR (gated-but-free, used by live.yaml) | indicconformer (NeMo, gated) | sarvam (PAID)
  model: small            # CPU-friendly multilingual default; use medium/large-v3 for quality, or backend=indicwav2vec (model ai4bharat/indicwav2vec-hindi) for native-script Indic
  language: auto          # auto-detect per speaker track | force an ISO code (hi, en, bn, ...). faster-whisper handles code-switch in detected mode
  device: cpu
  compute_type: int8      # int8 = small RAM/VRAM; use float16 on GPU for quality
  align: true             # faster-whisper emits native word timestamps (no separate WhisperX needed)
  normalizer: indic_script_safe   # NFC + indic-nlp-library (never Whisper's default) for WER/CER

postprocessing:
  backend: gemini         # gemini (free API, default) | ollama (OPTIONAL local) | api (OPTIONAL PAID)
  model: gemini-3.8-flash
  api_key_env: GEMINI_API_KEY
  host: http://localhost:11434   # used only by the optional ollama backend
  structured_output: true
  factual_consistency_check: true
  forbid_new_facts: true

evaluation:
  metrics:
    separation: [si_snri, sdri]
    diarization: [der, jer, speaker_count_error]
    asr: [wer, cer]
    summary: [rouge_l, bertscore, factual_consistency]
  measure_latency: true
  measure_peak_memory: true
